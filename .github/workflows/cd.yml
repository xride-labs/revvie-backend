name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expect_production_deploy:
        description: Fail this run if deployment secret is missing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Resolve deployment expectation
        id: expectation
        env:
          EXPECT_FROM_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.expect_production_deploy || 'false' }}
          EXPECT_FROM_VAR: ${{ vars.EXPECT_PRODUCTION_DEPLOYMENT || 'false' }}
        run: |
          if [ "$EXPECT_FROM_INPUT" = "true" ] || [ "$EXPECT_FROM_VAR" = "true" ]; then
            echo "expect=true" >> "$GITHUB_OUTPUT"
          else
            echo "expect=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy hook configuration
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.expectation.outputs.expect }}" = "true" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured. Add it in repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          echo "Render deploy hook secret is not configured; skipping deployment."

      - name: Trigger Render deploy
        if: steps.hook.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Render deployment";
            if [ "${{ steps.hook.outputs.configured }}" = "true" ]; then
              echo "- ✅ Deployment hook was configured and triggered.";
            elif [ "${{ steps.expectation.outputs.expect }}" = "true" ]; then
              echo "- ❌ Deployment was expected, but \`RENDER_DEPLOY_HOOK_URL\` was not configured.";
            else
              echo "- ⏭️ Deployment skipped because \`RENDER_DEPLOY_HOOK_URL\` is not configured.";
            fi
            echo "- Configure secret: **Settings → Secrets and variables → Actions → New repository secret**.";
            echo "- Secret name: \`RENDER_DEPLOY_HOOK_URL\`.";
            echo "- Optional repo variable \`EXPECT_PRODUCTION_DEPLOYMENT=true\` enforces failure when the secret is missing.";
          } >> "$GITHUB_STEP_SUMMARY"
